<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300" role="img" aria-label="Sift, a friendly purple flower monster">
  <defs>
    <linearGradient id="petal" x1="54" y1="20" x2="214" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1e9ff"/>
      <stop offset="0.35" stop-color="#c9b3ff"/>
      <stop offset="0.72" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="face" x1="88" y1="72" x2="172" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5edff"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- stem and leaves -->
  <path d="M130 196c-2 28 0 52-2 74" fill="none" stroke="#6d28d9" stroke-width="11" stroke-linecap="round"/>
  <path d="M128 250c-22-14-38-12-50-4 16 16 36 20 50 10z" fill="url(#leaf)"/>
  <path d="M130 258c22-14 38-12 50-4-16 16-36 20-50 10z" fill="url(#leaf)" opacity="0.85"/>

  <!-- waving leaf arm -->
  <path d="M72 160c-20-12-34-34-30-54 22 2 40 20 46 40z" fill="url(#leaf)"/>
  <path d="M188 164c20-10 33-30 31-50-22 1-41 17-49 36z" fill="url(#leaf)" opacity="0.85"/>

  <!-- petals -->
  <g fill="url(#petal)">
    <ellipse cx="130" cy="62" rx="31" ry="48"/>
    <ellipse cx="130" cy="62" rx="31" ry="48" transform="rotate(51.4 130 128)"/>
    <ellipse cx="130" cy="62" rx="31" ry="48" transform="rotate(102.8 130 128)"/>
    <ellipse cx="130" cy="62" rx="31" ry="48" transform="rotate(154.2 130 128)"/>
    <ellipse cx="130" cy="62" rx="31" ry="48" transform="rotate(205.6 130 128)"/>
    <ellipse cx="130" cy="62" rx="31" ry="48" transform="rotate(257 130 128)"/>
    <ellipse cx="130" cy="62" rx="31" ry="48" transform="rotate(308.4 130 128)"/>
  </g>

  <!-- face -->
  <circle cx="130" cy="128" r="59" fill="url(#face)"/>
  <circle cx="130" cy="128" r="59" fill="none" stroke="#eadfff" stroke-width="3"/>
  <g fill="#2b1055">
    <ellipse cx="109" cy="120" rx="6.4" ry="8.4"/>
    <ellipse cx="151" cy="120" rx="6.4" ry="8.4"/>
  </g>
  <g fill="#ffffff">
    <circle cx="111.6" cy="116.8" r="2.3"/>
    <circle cx="153.6" cy="116.8" r="2.3"/>
  </g>
  <path d="M111 141c7.5 8.5 30.5 8.5 38 0" fill="none" stroke="#2b1055" stroke-width="5.5" stroke-linecap="round"/>
  <g fill="#f2a7d8" opacity="0.55">
    <ellipse cx="96" cy="139" rx="8" ry="5"/>
    <ellipse cx="164" cy="139" rx="8" ry="5"/>
  </g>

  <!-- sparkles -->
  <g fill="#c4b5fd">
    <path d="M40 44l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" opacity="0.75"/>
    <path d="M220 96l3.4 7.6 7.6 3.4-7.6 3.4-3.4 7.6-3.4-7.6-7.6-3.4 7.6-3.4z" opacity="0.6"/>
  </g>
</svg>
